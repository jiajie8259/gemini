                const card = document.createElement('section');
                card.id = recipe.id;
                card.className = "recipe-card bg-white border border-slate-200 rounded-3xl p-6 sm:p-10 shadow-sm transition-all duration-300 hover:shadow-md relative scroll-mt-24";
                
                card.innerHTML = `
                    <span class="absolute top-6 right-6 lg:top-8 lg:right-10 text-sm font-black text-slate-300 uppercase tracking-widest border border-slate-200 px-3 py-1 rounded-full bg-slate-50">#${index + 1}</span>
                    
                    <div class="mb-8 pr-12">
                        <div class="flex items-center space-x-3 mb-3">
                            <span class="bg-zinc-800 text-white text-sm font-bold px-3 py-1 rounded-md shadow-sm">${recipe.code}</span>
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-[#27272a] mb-2 leading-tight">${recipe.title}</h2>
                        <p class="text-base text-rose-500 font-medium tracking-wide">${recipe.engTitle || ''}</p>
                        ${recipe.intro ? `<p class="mt-4 text-base text-slate-500 italic border-l-4 border-rose-300 pl-4 py-1">${recipe.intro}</p>` : ''}
                    </div>

                    ${ingredientsHTML}
                    ${stepsHTML}
                    ${tipsHTML}
                `;
                
                cardsContainer.appendChild(card);
            });
        }

        // Initialize Render
        renderApp();

        // Search functionality
        function searchRecipes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('recipe-card');
            
            for (let card of cards) {
                const text = card.textContent.toLowerCase();
                if (text.includes(query)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            }
        }

        // --- NEW SIDEBAR TOGGLE LOGIC ---
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const toggleIcon = document.getElementById("toggleIcon");
            const isDesktop = window.innerWidth >= 1024;
            
            if (isDesktop) {
                // 桌機版縮放邏輯：改變寬度與內距至0，左側就會平滑收起
                if (sidebar.classList.contains("lg:w-80")) {
                    // 收起左側欄
                    sidebar.classList.remove("lg:w-80", "p-5", "border-r");
                    sidebar.classList.add("lg:w-0", "p-0", "border-r-0");
                } else {
                    // 展開左側欄
                    sidebar.classList.add("lg:w-80", "p-5", "border-r");
                    sidebar.classList.remove("lg:w-0", "p-0", "border-r-0");
                }
            } else {
                // 手機版邏輯：使用 absolute 覆蓋在內容上方
                if (sidebar.classList.contains("hidden")) {
                    sidebar.classList.remove("hidden");
                    sidebar.classList.add("absolute", "z-40", "shadow-2xl", "h-[calc(100vh-80px)]", "w-full", "left-0");
                    toggleIcon.classList.remove("fa-bars");
                    toggleIcon.classList.add("fa-xmark");
                } else {
                    sidebar.classList.add("hidden");
                    sidebar.classList.remove("absolute", "z-40", "shadow-2xl", "h-[calc(100vh-80px)]", "w-full", "left-0");
                    toggleIcon.classList.remove("fa-xmark");
                    toggleIcon.classList.add("fa-bars");
                }
            }
        }

        // 監聽視窗大小改變，防止縮放視窗時選單卡住跑版
        window.addEventListener('resize', () => {
            const sidebar = document.getElementById("sidebar");
            const toggleIcon = document.getElementById("toggleIcon");
            const isDesktop = window.innerWidth >= 1024;
            
            if (isDesktop) {
                // 恢復桌機預設展開狀態，清除手機版用的 absolute 等 class
                sidebar.classList.remove("hidden", "absolute", "z-40", "shadow-2xl", "h-[calc(100vh-80px)]", "w-full", "left-0");
                sidebar.classList.add("lg:w-80", "p-5", "border-r");
                sidebar.classList.remove("lg:w-0", "p-0", "border-r-0");
                toggleIcon.classList.remove("fa-xmark");
                toggleIcon.classList.add("fa-bars");
            } else {
                // 恢復手機預設隱藏狀態
                sidebar.classList.add("hidden");
                sidebar.classList.remove("absolute", "z-40", "shadow-2xl", "h-[calc(100vh-80px)]", "w-full", "left-0");
                toggleIcon.classList.remove("fa-xmark");
                toggleIcon.classList.add("fa-bars");
            }
        });

        // Active State highlighting on scroll
        const contentArea = document.getElementById("recipesContent");
        contentArea.addEventListener("scroll", () => {
            const sections = document.querySelectorAll(".recipe-card");
            let currentActiveId = "";
            
            sections.forEach(sec => {
                const rect = sec.getBoundingClientRect();
                // Check if element is near the top of the view
                if (rect.top >= 0 && rect.top <= 300) {
                    currentActiveId = sec.id;
                }
            });
            
            if (currentActiveId) {
                const navLinks = sidebarMenu.querySelectorAll("a");
                navLinks.forEach(link => {
                    const targetId = link.dataset.target;
                    if (targetId === currentActiveId) {
                        link.classList.add("bg-rose-50", "text-rose-600", "border-rose-200");
                        link.classList.remove("text-slate-600", "border-transparent");
                        // Also change numbering circle color
                        link.querySelector('span:first-child').classList.add("bg-rose-500", "text-white");
                        link.querySelector('span:first-child').classList.remove("bg-slate-200", "text-slate-700");
                    } else {
                        link.classList.remove("bg-rose-50", "text-rose-600", "border-rose-200");
                        link.classList.add("text-slate-600", "border-transparent");
                        // Reset numbering circle
                        link.querySelector('span:first-child').classList.remove("bg-rose-500", "text-white");
                        link.querySelector('span:first-child').classList.add("bg-slate-200", "text-slate-700");
                    }
                });
            }
        });

        // Add smooth scrolling specifically for sidebar links
        document.querySelectorAll('#sidebarMenu a').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href').substring(1);
                const targetElement = document.getElementById(targetId);
                
                // For mobile, hide sidebar after click
                if (window.innerWidth < 1024) {
                    toggleSidebar();
                }

                if (targetElement) {
                    targetElement.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
</body>
</html>
